
name: Security Gate

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  SECRET_KEY: "chave-exclusiva-testes-0123456789"
  MFA_DEMO_CODE: "123456"
  LABORATORIO_CLIENT_SECRET: "segredo-m2m-teste"
  ADMIN_PASSWORD: "senha-admin-teste"
  DR_JOAO_PASSWORD: "senha-medico-teste"
  RECEPCAO_PASSWORD: "senha-recepcao-teste"
  DATABASE_URL: "sqlite:///./ci.db"

jobs:

  tests:
    name: Testes pytest
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: |
          pytest -v --tb=short \
            --junitxml=relatorio-testes.xml

      - name: Salvar relatorio dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-pytest
          path: relatorio-testes.xml
          if-no-files-found: ignore


  sast:
    name: SAST
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep

      - name: Bandit - vulnerabilidades Python
        run: |
          bandit -r app -lll

      - name: Semgrep - regras Python
        run: |
          semgrep scan \
            --config p/python \
            --severity ERROR \
            --error app


  sca:
    name: SCA e Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Trivy - dependencias e secrets
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table


  # 4. DAST - Analise dinamica
  dast:
    name: DAST OWASP ZAP
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Iniciar API
        run: |
          nohup uvicorn app.main:app \
            --host 0.0.0.0 \
            --port 8000 > app.log 2>&1 &

      - name: Aguardar API
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/docs; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8000/docs

      - name: OWASP ZAP Baseline
        run: |
          docker run --network host \
            -v "$PWD:/zap/wrk/:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8000 \
            -r zap-report.html \
            -J zap-report.json \
            -I \
            -l FAIL

      - name: Salvar relatorio ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-owasp-zap
          path: |
            zap-report.html
            zap-report.json
            app.log
          if-no-files-found: ignore